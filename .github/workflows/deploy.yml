name: Deploy Frontend, Admin and Backend to Ubuntu Server

on:
    push:
        branches: [master]

env:
    # Включить после настройки SSL (Cloudflare или certbot): "true"
    RUN_SMOKE_TESTS: "false"

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Create .env file from secret
              working-directory: ./frontend
              run: |
                  echo "${{ secrets.FRONT_ENV }}" > .env

            - name: Install dependencies and build frontend
              working-directory: ./frontend
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "frontend/dist/**"
                  target: "/var/www/alexol.io/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate frontend
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/html
                      STAGING=/var/www/alexol.io/html.staging
                      test -f "$STAGING/index.html"
                      test -f "$STAGING/robots.txt"
                      test -f "$STAGING/sitemap.xml"
                      js=$(grep -oE "/assets/[^\"]+\.js" "$STAGING/index.html" | head -1)
                      css=$(grep -oE "/assets/[^\"]+\.css" "$STAGING/index.html" | head -1 || true)
                      test -n "$js"
                      test -f "$STAGING$js"
                      if [ -n "$css" ]; then test -f "$STAGING$css"; fi
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      grep -qi 'User-agent:' "$LIVE/robots.txt"
                      grep -qi 'urlset' "$LIVE/sitemap.xml"
                      echo "frontend activated: $js"'

            - name: Smoke test frontend
              if: env.RUN_SMOKE_TESTS == 'true'
              run: |
                  set -euo pipefail

                  fetch() {
                    local url="$1"
                    local attempt=1
                    while [ "$attempt" -le 5 ]; do
                      if out=$(curl -fsS --max-time 15 "$url" 2>/dev/null); then
                        printf '%s' "$out"
                        return 0
                      fi
                      echo "curl attempt $attempt failed: $url"
                      attempt=$((attempt + 1))
                      sleep 5
                    done
                    echo "curl failed after 5 attempts: $url" >&2
                    curl -v --max-time 15 "$url" || true
                    return 1
                  }

                  robots=$(fetch "https://alexol.io/robots.txt")
                  echo "$robots" | grep -qi '^User-agent:' || { echo "robots.txt invalid:"; echo "$robots" | head -5; exit 1; }

                  sitemap=$(fetch "https://alexol.io/sitemap.xml")
                  echo "$sitemap" | grep -qi 'urlset' || { echo "sitemap.xml invalid:"; echo "$sitemap" | head -5; exit 1; }

                  curl -fsSI --max-time 15 http://alexol.io/robots.txt | grep -qi '301'
                  www_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://www.alexol.io/robots.txt)
                  test "$www_status" = "301" -o "$www_status" = "200"

                  html=$(fetch "https://alexol.io/")
                  js=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
                  test -n "$js"
                  fetch "https://alexol.io${js}" > /dev/null
                  echo "frontend OK: https://alexol.io${js} (www robots: HTTP $www_status)"

    deploy-lang:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies and build lang Mini App
              working-directory: ./lang
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/lang/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "lang/dist/**"
                  target: "/var/www/alexol.io/lang/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate lang
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/lang/html
                      STAGING=/var/www/alexol.io/lang/html.staging
                      test -f "$STAGING/index.html"
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      echo "lang activated"'

    deploy-mail:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies and build mail client
              working-directory: ./mail
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/mail/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "mail/dist/**"
                  target: "/var/www/alexol.io/mail/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate mail
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/mail/html
                      STAGING=/var/www/alexol.io/mail/html.staging
                      test -f "$STAGING/index.html"
                      js=$(grep -oE "/assets/[^\"]+\.js" "$STAGING/index.html" | head -1)
                      test -n "$js"
                      test -f "$STAGING$js"
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      echo "mail activated: $js"'

    deploy-mail-server:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create mail-server .env from secret
              run: |
                  echo "${{ secrets.MAIL_ENV }}" > mail-server/.env

            - name: Write DKIM private key from secret
              env:
                  DKIM_B64: ${{ secrets.MAIL_DKIM_PRIVATE_KEY_B64 }}
              run: |
                  mkdir -p mail-server/dkim
                  if [ -z "$DKIM_B64" ]; then
                    echo "::warning::MAIL_DKIM_PRIVATE_KEY_B64 not set — outbound mail will be unsigned"
                    exit 0
                  fi
                  if printf '%s' "$DKIM_B64" | grep -q 'BEGIN.*PRIVATE KEY'; then
                    printf '%s\n' "$DKIM_B64" > mail-server/dkim/private.pem
                  else
                    printf '%s' "$DKIM_B64" | tr -d ' \n\r\t' | base64 -d > mail-server/dkim/private.pem
                  fi
                  chmod 600 mail-server/dkim/private.pem
                  head -1 mail-server/dkim/private.pem | grep -q 'BEGIN.*PRIVATE KEY'
                  echo "DKIM private key written ($(wc -c < mail-server/dkim/private.pem) bytes)"

            - name: Prepare server directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S mkdir -p /var/www/mail/backend /var/www/mail/dkim
                      echo "${{ secrets.PWD }}" | sudo -S chown -R $USER:$USER /var/www/mail
                      echo "${{ secrets.PWD }}" | sudo -S chmod -R 755 /var/www/mail

            - name: Deploy mail-server backend
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "mail-server/**"
                  target: "/var/www/mail"
                  overwrite: true
                  strip_components: 1

            - name: Start mail-server with Docker Compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script_stop: true
                  command_timeout: 30m
                  script: |
                      cd /var/www/mail
                      if [ -f dkim/private.pem ]; then
                        chmod 600 dkim/private.pem
                      else
                        echo "WARNING: dkim/private.pem missing on server"
                      fi
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc '
                      set -e
                      cd /var/www/mail
                      if docker compose version >/dev/null 2>&1; then
                        dc="docker compose"
                      elif command -v docker-compose >/dev/null 2>&1; then
                        dc="docker-compose"
                      else
                        echo "Docker Compose not found"
                        exit 1
                      fi
                      $dc down --remove-orphans || true
                      docker network inspect alexol_mail_sync >/dev/null 2>&1 || docker network create alexol_mail_sync
                      if ! $dc build backend; then
                        echo "WARN: compose build hit a Docker snapshot error; pruning BuildKit cache"
                        docker builder prune -af || true
                        docker buildx prune -af || true
                        $dc build --no-cache backend
                      fi
                      $dc up -d --force-recreate
                      $dc ps
                      if command -v ufw >/dev/null 2>&1; then
                        ufw allow 389/tcp comment "LDAP GAL" || true
                        ufw allow 636/tcp comment "LDAPS GAL" || true
                      fi
                      '

    deploy-admin:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Create .env file from secret
              working-directory: ./admin
              run: |
                  echo "${{ secrets.ADMIN_ENV }}" > .env

            - name: Install dependencies and build admin
              working-directory: ./admin
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/admin/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "admin/dist/**"
                  target: "/var/www/alexol.io/admin/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate admin
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/admin/html
                      STAGING=/var/www/alexol.io/admin/html.staging
                      test -f "$STAGING/index.html"
                      js=$(grep -oE "/assets/[^\"]+\.js" "$STAGING/index.html" | head -1)
                      css=$(grep -oE "/assets/[^\"]+\.css" "$STAGING/index.html" | head -1 || true)
                      test -n "$js"
                      test -f "$STAGING$js"
                      if [ -n "$css" ]; then test -f "$STAGING$css"; fi
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      echo "admin activated: $js"'

            - name: Smoke test admin via Cloudflare
              if: env.RUN_SMOKE_TESTS == 'true'
              run: |
                  fetch() {
                    local url="$1"
                    local attempt=1
                    while [ "$attempt" -le 5 ]; do
                      if out=$(curl -fsS --max-time 15 "$url"); then
                        printf '%s' "$out"
                        return 0
                      fi
                      echo "curl attempt $attempt failed: $url"
                      attempt=$((attempt + 1))
                      sleep 5
                    done
                    return 1
                  }

                  html=""
                  if html=$(fetch "https://admin.alexol.io/"); then
                    base="https://admin.alexol.io"
                  elif html=$(fetch "http://admin.alexol.io/"); then
                    echo "::warning::HTTPS недоступен для admin.alexol.io. Включи Cloudflare Proxy (оранжевое облако) и SSL Flexible."
                    base="http://admin.alexol.io"
                  else
                    echo "admin.alexol.io недоступен ни по HTTPS, ни по HTTP" >&2
                    exit 1
                  fi

                  js=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
                  test -n "$js"
                  fetch "${base}${js}" > /dev/null
                  echo "admin OK: ${base}${js}"

    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create .env file from secret
              run: |
                  echo "${{ secrets.ENV_BE }}" > backend/.env

            - name: Prepare server directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S mkdir -p /var/www/alexol.io/back
                      echo "${{ secrets.PWD }}" | sudo -S chown -R $USER:$USER /var/www/alexol.io/back
                      echo "${{ secrets.PWD }}" | sudo -S chmod -R 755 /var/www/alexol.io/back

            - name: Deploy backend to server
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "backend/**"
                  target: "/var/www/alexol.io/back"
                  overwrite: true
                  strip_components: 1

            - name: Start backend with Docker Compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script_stop: true
                  command_timeout: 30m
                  script: |
                      cd /var/www/alexol.io/back
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc '
                      set -e
                      cd /var/www/alexol.io/back
                      if docker compose version >/dev/null 2>&1; then
                        dc="docker compose"
                      elif command -v docker-compose >/dev/null 2>&1; then
                        dc="docker-compose"
                      else
                        echo "Docker Compose not found"
                        exit 1
                      fi
                      $dc down --remove-orphans || true
                      docker network inspect alexol_mail_sync >/dev/null 2>&1 || docker network create alexol_mail_sync
                      if ! $dc build backend bot_news; then
                        echo "WARN: compose build hit a Docker snapshot error; pruning BuildKit cache"
                        docker builder prune -af || true
                        docker buildx prune -af || true
                        $dc build --no-cache backend bot_news
                      fi
                      $dc up -d --force-recreate
                      $dc up -d bot_news bot_requests bot_speak
                      $dc ps
                      '
