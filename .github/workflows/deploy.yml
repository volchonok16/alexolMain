name: Deploy Frontend, Admin and Backend to Ubuntu Server

on:
    push:
        branches: [master]

env:
    # Включить после настройки SSL (Cloudflare или certbot): "true"
    RUN_SMOKE_TESTS: "false"

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Create .env file from secret
              working-directory: ./frontend
              run: |
                  echo "${{ secrets.FRONT_ENV }}" > .env

            - name: Install dependencies and build frontend
              working-directory: ./frontend
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "frontend/dist/**"
                  target: "/var/www/alexol.io/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate frontend
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/html
                      STAGING=/var/www/alexol.io/html.staging
                      test -f "$STAGING/index.html"
                      test -f "$STAGING/robots.txt"
                      test -f "$STAGING/sitemap.xml"
                      js=$(grep -oE "/assets/[^\"]+\.js" "$STAGING/index.html" | head -1)
                      css=$(grep -oE "/assets/[^\"]+\.css" "$STAGING/index.html" | head -1 || true)
                      test -n "$js"
                      test -f "$STAGING$js"
                      if [ -n "$css" ]; then test -f "$STAGING$css"; fi
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      grep -qi 'User-agent:' "$LIVE/robots.txt"
                      grep -qi 'urlset' "$LIVE/sitemap.xml"
                      echo "frontend activated: $js"'

            - name: Smoke test frontend
              if: env.RUN_SMOKE_TESTS == 'true'
              run: |
                  set -euo pipefail

                  fetch() {
                    local url="$1"
                    local attempt=1
                    while [ "$attempt" -le 5 ]; do
                      if out=$(curl -fsS --max-time 15 "$url" 2>/dev/null); then
                        printf '%s' "$out"
                        return 0
                      fi
                      echo "curl attempt $attempt failed: $url"
                      attempt=$((attempt + 1))
                      sleep 5
                    done
                    echo "curl failed after 5 attempts: $url" >&2
                    curl -v --max-time 15 "$url" || true
                    return 1
                  }

                  robots=$(fetch "https://alexol.io/robots.txt")
                  echo "$robots" | grep -qi '^User-agent:' || { echo "robots.txt invalid:"; echo "$robots" | head -5; exit 1; }

                  sitemap=$(fetch "https://alexol.io/sitemap.xml")
                  echo "$sitemap" | grep -qi 'urlset' || { echo "sitemap.xml invalid:"; echo "$sitemap" | head -5; exit 1; }

                  curl -fsSI --max-time 15 http://alexol.io/robots.txt | grep -qi '301'
                  www_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://www.alexol.io/robots.txt)
                  test "$www_status" = "301" -o "$www_status" = "200"

                  html=$(fetch "https://alexol.io/")
                  js=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
                  test -n "$js"
                  fetch "https://alexol.io${js}" > /dev/null
                  echo "frontend OK: https://alexol.io${js} (www robots: HTTP $www_status)"

    deploy-lang:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies and build lang Mini App
              working-directory: ./lang
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/lang/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "lang/dist/**"
                  target: "/var/www/alexol.io/lang/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate lang
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/lang/html
                      STAGING=/var/www/alexol.io/lang/html.staging
                      test -f "$STAGING/index.html"
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      echo "lang activated"'

    deploy-mail:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies and build mail client
              working-directory: ./mail
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/mail/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "mail/dist/**"
                  target: "/var/www/alexol.io/mail/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate mail
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/mail/html
                      STAGING=/var/www/alexol.io/mail/html.staging
                      test -f "$STAGING/index.html"
                      js=$(grep -oE "/assets/[^\"]+\.js" "$STAGING/index.html" | head -1)
                      test -n "$js"
                      test -f "$STAGING$js"
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      echo "mail activated: $js"'

    deploy-mail-server:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create mail-server .env from secret
              env:
                  MAIL_ENV: ${{ secrets.MAIL_ENV }}
                  ROCKET_ENV: ${{ secrets.ROCKET_ENV }}
                  JITSI_ENV: ${{ secrets.jitsi_env }}
              run: |
                  printf '%s\n' "$MAIL_ENV" > mail-server/.env
                  mkdir -p rocket jitsi
                  if [ -n "$ROCKET_ENV" ]; then printf '%s\n' "$ROCKET_ENV" > rocket/.env; else touch rocket/.env; fi
                  if [ -n "$JITSI_ENV" ]; then printf '%s\n' "$JITSI_ENV" > jitsi/.env; else touch jitsi/.env; fi
                  chmod +x scripts/stitch-deploy-env.sh
                  bash scripts/stitch-deploy-env.sh

            - name: Write DKIM private key from secret
              env:
                  DKIM_B64: ${{ secrets.MAIL_DKIM_PRIVATE_KEY_B64 }}
              run: |
                  mkdir -p mail-server/dkim
                  if [ -z "$DKIM_B64" ]; then
                    echo "::warning::MAIL_DKIM_PRIVATE_KEY_B64 not set — outbound mail will be unsigned"
                    exit 0
                  fi
                  if printf '%s' "$DKIM_B64" | grep -q 'BEGIN.*PRIVATE KEY'; then
                    printf '%s\n' "$DKIM_B64" > mail-server/dkim/private.pem
                  else
                    printf '%s' "$DKIM_B64" | tr -d ' \n\r\t' | base64 -d > mail-server/dkim/private.pem
                  fi
                  chmod 600 mail-server/dkim/private.pem
                  head -1 mail-server/dkim/private.pem | grep -q 'BEGIN.*PRIVATE KEY'
                  echo "DKIM private key written ($(wc -c < mail-server/dkim/private.pem) bytes)"

            - name: Prepare server directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S mkdir -p /var/www/mail/backend /var/www/mail/dkim
                      echo "${{ secrets.PWD }}" | sudo -S chown -R $USER:$USER /var/www/mail
                      echo "${{ secrets.PWD }}" | sudo -S chmod -R 755 /var/www/mail

            - name: Deploy mail-server backend
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "mail-server/**"
                  target: "/var/www/mail"
                  overwrite: true
                  strip_components: 1

            - name: Start mail-server with Docker Compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script_stop: true
                  command_timeout: 30m
                  script: |
                      cd /var/www/mail
                      if [ -f dkim/private.pem ]; then
                        chmod 600 dkim/private.pem
                      else
                        echo "WARNING: dkim/private.pem missing on server"
                      fi
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc '
                      set -e
                      cd /var/www/mail
                      if docker compose version >/dev/null 2>&1; then
                        dc="docker compose"
                      elif command -v docker-compose >/dev/null 2>&1; then
                        dc="docker-compose"
                      else
                        echo "Docker Compose not found"
                        exit 1
                      fi
                      $dc down --remove-orphans || true
                      docker network inspect alexol_mail_sync >/dev/null 2>&1 || docker network create alexol_mail_sync
                      if ! $dc build backend; then
                        echo "WARN: compose build hit a Docker snapshot error; pruning BuildKit cache"
                        docker builder prune -af || true
                        docker buildx prune -af || true
                        $dc build --no-cache backend
                      fi
                      $dc up -d --force-recreate
                      $dc ps
                      if command -v ufw >/dev/null 2>&1; then
                        ufw allow 25/tcp comment "SMTP inbound" || true
                        ufw allow 465/tcp comment "SMTPS" || true
                        ufw allow 587/tcp comment "SMTP submission" || true
                        ufw allow 2465/tcp comment "SMTPS alt" || true
                        ufw allow 2587/tcp comment "SMTP submission alt" || true
                        ufw allow 143/tcp comment "IMAP" || true
                        ufw allow 993/tcp comment "IMAPS" || true
                        ufw allow 389/tcp comment "LDAP GAL" || true
                        ufw allow 636/tcp comment "LDAPS GAL" || true
                      fi
                      '

    deploy-jitsi:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create jitsi .env from secret
              env:
                  MAIL_ENV: ${{ secrets.MAIL_ENV }}
                  ROCKET_ENV: ${{ secrets.ROCKET_ENV }}
                  JITSI_ENV: ${{ secrets.jitsi_env }}
              run: |
                  mkdir -p mail-server rocket jitsi
                  if [ -n "$MAIL_ENV" ]; then printf '%s\n' "$MAIL_ENV" > mail-server/.env; else touch mail-server/.env; fi
                  if [ -n "$ROCKET_ENV" ]; then printf '%s\n' "$ROCKET_ENV" > rocket/.env; else touch rocket/.env; fi
                  if [ -n "$JITSI_ENV" ]; then
                    printf '%s\n' "$JITSI_ENV" > jitsi/.env
                    echo "jitsi_env written ($(wc -l < jitsi/.env) lines)"
                  else
                    touch jitsi/.env
                    echo "jitsi_env not set — server keeps existing .env or env.public"
                  fi
                  chmod +x scripts/stitch-deploy-env.sh
                  bash scripts/stitch-deploy-env.sh

            - name: Prepare Jitsi directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S mkdir -p /var/www/jitsi
                      echo "${{ secrets.PWD }}" | sudo -S chown -R $USER:$USER /var/www/jitsi
                      echo "${{ secrets.PWD }}" | sudo -S chmod -R 755 /var/www/jitsi

            - name: Deploy Jitsi compose
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "jitsi/**"
                  target: "/var/www/jitsi"
                  overwrite: true
                  strip_components: 1

            # scp jitsi/** skips dotfiles, so the GitHub secret never landed in /var/www/jitsi/.env
            - name: Deploy Jitsi .env
              if: hashFiles('jitsi/.env') != ''
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "jitsi/.env"
                  target: "/var/www/jitsi"
                  overwrite: true
                  strip_components: 1

            - name: Start Jitsi if not running
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  command_timeout: 30m
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S -p '' bash -lc '
                      trap "echo JITSIDEPLOY_ERR:\$LINENO" ERR
                      set -e
                      echo JITSIDEPLOY_1
                      cd /var/www/jitsi
                      sed -i "s/\r$//" gen-passwords.sh .env env.public 2>/dev/null || true
                      chmod +x gen-passwords.sh
                      if docker compose version >/dev/null 2>&1; then
                        dc="docker compose"
                      elif command -v docker-compose >/dev/null 2>&1; then
                        dc="docker-compose"
                      else
                        echo "Docker Compose not found"
                        exit 1
                      fi
                      if [ ! -f .env ]; then
                        cp env.public .env
                      fi
                      while IFS= read -r line || [ -n "$line" ]; do
                        case "$line" in
                          ""|"#"*) continue ;;
                        esac
                        key="${line%%=*}"
                        case "$key" in
                          *" "*) echo JITSIDEPLOY_bad_env_key; exit 1 ;;
                        esac
                      done < .env
                      echo JITSIDEPLOY_2
                      bash gen-passwords.sh
                      jwt_secret=$(grep -E "^JWT_APP_SECRET=" .env | tail -1 | cut -d= -f2- | tr -d "\r" || true)
                      if [ -n "$jwt_secret" ]; then
                        sed -i "s/^ENABLE_AUTH=.*/ENABLE_AUTH=1/" .env
                        grep -qE "^ENABLE_AUTH=" .env || echo "ENABLE_AUTH=1" >> .env
                        grep -qE "^AUTH_TYPE=" .env || echo "AUTH_TYPE=jwt" >> .env
                        sed -i "s/^ENABLE_GUESTS=.*/ENABLE_GUESTS=0/" .env
                        grep -qE "^ENABLE_GUESTS=" .env || echo "ENABLE_GUESTS=0" >> .env
                        sed -i "s/^JWT_ALLOW_EMPTY=.*/JWT_ALLOW_EMPTY=0/" .env
                        grep -qE "^JWT_ALLOW_EMPTY=" .env || echo "JWT_ALLOW_EMPTY=0" >> .env
                        grep -qE "^ENABLE_AUTO_OWNER=" .env || echo "ENABLE_AUTO_OWNER=1" >> .env
                        sed -i "s/^ENABLE_PREJOIN_PAGE=.*/ENABLE_PREJOIN_PAGE=0/" .env
                        grep -qE "^ENABLE_PREJOIN_PAGE=" .env || echo "ENABLE_PREJOIN_PAGE=0" >> .env
                        sed -i "s/^ENABLE_REQUIRE_DISPLAY_NAME=.*/ENABLE_REQUIRE_DISPLAY_NAME=0/" .env
                        grep -qE "^ENABLE_REQUIRE_DISPLAY_NAME=" .env || echo "ENABLE_REQUIRE_DISPLAY_NAME=0" >> .env
                        if grep -qE "^TOKEN_AUTH_URL_AUTO_REDIRECT=" .env; then
                          sed -i "s/^TOKEN_AUTH_URL_AUTO_REDIRECT=.*/TOKEN_AUTH_URL_AUTO_REDIRECT=1/" .env
                        else
                          echo "TOKEN_AUTH_URL_AUTO_REDIRECT=1" >> .env
                        fi
                        tok="https://mail.alexol.io/jitsi-auth?room="
                        tok="${tok}""{""room""}"
                        if grep -qE "^TOKEN_AUTH_URL=" .env; then
                          sed -i "s|^TOKEN_AUTH_URL=.*|TOKEN_AUTH_URL=${tok}|" .env
                        else
                          echo "TOKEN_AUTH_URL=${tok}" >> .env
                        fi
                        if grep -qE "^ENABLE_IFRAME_API=" .env; then
                          sed -i "s/^ENABLE_IFRAME_API=.*/ENABLE_IFRAME_API=1/" .env
                        else
                          echo "ENABLE_IFRAME_API=1" >> .env
                        fi
                        issuers="alexol,RocketChat"
                        if grep -qE "^JWT_ACCEPTED_ISSUERS=" .env; then
                          sed -i "s|^JWT_ACCEPTED_ISSUERS=.*|JWT_ACCEPTED_ISSUERS=${issuers}|" .env
                        else
                          echo "JWT_ACCEPTED_ISSUERS=${issuers}" >> .env
                        fi
                        if grep -qE "^JWT_ACCEPTED_AUDIENCES=" .env; then
                          sed -i "s|^JWT_ACCEPTED_AUDIENCES=.*|JWT_ACCEPTED_AUDIENCES=${issuers}|" .env
                        else
                          echo "JWT_ACCEPTED_AUDIENCES=${issuers}" >> .env
                        fi
                      fi
                      echo JITSIDEPLOY_3
                      sed -i "s/^JVB_PORT=.*/JVB_PORT=10001/" .env
                      grep -qE "^JVB_PORT=" .env || echo "JVB_PORT=10001" >> .env
                      jvb_port=10001
                      pub_ip=$(curl -4 -fsS --max-time 8 https://ifconfig.me || true)
                      if [ -z "$pub_ip" ]; then
                        pub_ip=$(hostname -I | awk "{print \$1}")
                      fi
                      if [ -n "$pub_ip" ]; then
                        sed -i "s|^JVB_ADVERTISE_IPS=.*|JVB_ADVERTISE_IPS=\"${pub_ip}#${jvb_port}\"|" .env
                        grep -qE "^JVB_ADVERTISE_IPS=" .env || echo "JVB_ADVERTISE_IPS=\"${pub_ip}#${jvb_port}\"" >> .env
                      fi
                      if command -v ufw >/dev/null 2>&1; then
                        ufw allow "${jvb_port}/udp" comment "Jitsi JVB" || true
                      fi
                      mkdir -p /var/www/jitsi/.jitsi-meet-cfg/web \
                        /var/www/jitsi/.jitsi-meet-cfg/jvb \
                        /var/www/jitsi/.jitsi-meet-cfg/jicofo \
                        /var/www/jitsi/.jitsi-meet-cfg/prosody/config \
                        /var/www/jitsi/.jitsi-meet-cfg/prosody/prosody-plugins-custom
                      all_up=1
                      for c in jitsi_web jitsi_prosody jitsi_jicofo jitsi_jvb; do
                        if [ -z "$(docker ps -q -f name=^${c}$ -f status=running)" ]; then
                          all_up=0
                        fi
                      done
                      echo JITSIDEPLOY_4_all_up_$all_up
                      if [ "$all_up" = 1 ]; then
                        jwt_ready=0
                        auth_url_ready=0
                        guests_lobby=0
                        if docker inspect jitsi_web 2>/dev/null | grep -q "ENABLE_AUTH=1"; then
                          jwt_ready=1
                        fi
                        if docker inspect jitsi_web 2>/dev/null | grep -q "jitsi-auth"; then
                          auth_url_ready=1
                        fi
                        if docker inspect jitsi_web 2>/dev/null | grep -q "ENABLE_GUESTS=1"; then
                          guests_lobby=1
                        fi
                        if docker inspect jitsi_web 2>/dev/null | grep -q "JWT_ALLOW_EMPTY=1"; then
                          guests_lobby=1
                        fi
                        if docker inspect jitsi_web 2>/dev/null | grep -q "ENABLE_PREJOIN_PAGE=1"; then
                          guests_lobby=1
                        fi
                        if [ -z "$jwt_secret" ] || [ "$jwt_ready" = 1 -a "$auth_url_ready" = 1 -a "$guests_lobby" = 0 ]; then
                          echo "Jitsi already running, skip up"
                          $dc ps
                          exit 0
                        fi
                        echo "JWT/guest lobby changed, recreating Jitsi"
                      fi
                      echo JITSIDEPLOY_5
                      docker rm -f jitsi_jvb >/dev/null 2>&1 || true
                      if docker image inspect ghcr.io/jitsi/jvb:stable >/dev/null 2>&1; then
                        echo "Jitsi images already present, skip pull"
                      else
                        $dc pull
                      fi
                      echo JITSIDEPLOY_6
                      if [ -n "$jwt_secret" ]; then
                        $dc up -d --force-recreate
                      else
                        $dc up -d
                      fi
                      echo JITSIDEPLOY_7
                      $dc ps
                      '

    deploy-rocket:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create rocket .env from secret
              env:
                  MAIL_ENV: ${{ secrets.MAIL_ENV }}
                  ROCKET_ENV: ${{ secrets.ROCKET_ENV }}
                  JITSI_ENV: ${{ secrets.jitsi_env }}
              run: |
                  mkdir -p mail-server rocket jitsi
                  if [ -n "$MAIL_ENV" ]; then printf '%s\n' "$MAIL_ENV" > mail-server/.env; else touch mail-server/.env; fi
                  if [ -n "$ROCKET_ENV" ]; then
                    printf '%s\n' "$ROCKET_ENV" > rocket/.env
                    echo "ROCKET_ENV written ($(wc -l < rocket/.env) lines)"
                  else
                    touch rocket/.env
                    echo "ROCKET_ENV not set — server keeps existing .env"
                  fi
                  if [ -n "$JITSI_ENV" ]; then printf '%s\n' "$JITSI_ENV" > jitsi/.env; else touch jitsi/.env; fi
                  chmod +x scripts/stitch-deploy-env.sh
                  bash scripts/stitch-deploy-env.sh

            - name: Prepare Rocket.Chat directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S mkdir -p /var/www/rocket
                      echo "${{ secrets.PWD }}" | sudo -S chown -R $USER:$USER /var/www/rocket
                      echo "${{ secrets.PWD }}" | sudo -S chmod -R 755 /var/www/rocket

            - name: Deploy Rocket.Chat compose
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "rocket/**"
                  target: "/var/www/rocket"
                  overwrite: true
                  strip_components: 1

            - name: Deploy Rocket.Chat .env
              if: hashFiles('rocket/.env') != ''
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "rocket/.env"
                  target: "/var/www/rocket"
                  overwrite: true
                  strip_components: 1

            - name: Start Rocket.Chat
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  command_timeout: 30m
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S -p '' bash -lc '
                      set -e
                      cd /var/www/rocket
                      sed -i "s/\r$//" configure.sh .env env.example 2>/dev/null || true
                      chmod +x configure.sh
                      if docker compose version >/dev/null 2>&1; then
                        dc="docker compose"
                      elif command -v docker-compose >/dev/null 2>&1; then
                        dc="docker-compose"
                      else
                        echo "Docker Compose not found"
                        exit 1
                      fi
                      if [ ! -f .env ]; then
                        echo "rocket/.env missing — add GitHub secret ROCKET_ENV"
                        exit 1
                      fi
                      $dc pull
                      $dc up -d
                      echo "configure: re-apply OAuth, LDAP, Jitsi settings"
                      $dc run --rm --no-deps configure || $dc up -d --force-recreate configure
                      if [ -f install-jitsi-app.sh ] && grep -qE '^JITSI_JWT_APP_SECRET=.+' .env 2>/dev/null; then
                        chmod +x install-jitsi-app.sh
                        sh install-jitsi-app.sh || echo "install-jitsi-app: skipped or already installed"
                      else
                        echo "install-jitsi-app: skipped (no JITSI_JWT_APP_SECRET in .env)"
                      fi
                      echo "sync chat profiles from mail"
                      sleep 10
                      if docker ps --format '{{.Names}}' | grep -qx mail_backend; then
                        docker exec mail_backend python /app/scripts/sync_chat_profiles.py || true
                      fi
                      $dc ps
                      '

    deploy-admin:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Create .env file from secret
              working-directory: ./admin
              run: |
                  echo "${{ secrets.ADMIN_ENV }}" > .env

            - name: Install dependencies and build admin
              working-directory: ./admin
              run: |
                  npm install
                  npm run build
                  ls -laR dist/

            - name: Prepare staging directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      STAGING=/var/www/alexol.io/admin/html.staging
                      rm -rf "$STAGING"
                      mkdir -p "$STAGING"
                      chown -R $SUDO_USER:$SUDO_USER "$STAGING"
                      chmod -R 755 "$STAGING"'

            - name: Upload build to staging
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "admin/dist/**"
                  target: "/var/www/alexol.io/admin/html.staging"
                  overwrite: true
                  strip_components: 2

            - name: Verify and activate admin
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      LIVE=/var/www/alexol.io/admin/html
                      STAGING=/var/www/alexol.io/admin/html.staging
                      test -f "$STAGING/index.html"
                      js=$(grep -oE "/assets/[^\"]+\.js" "$STAGING/index.html" | head -1)
                      css=$(grep -oE "/assets/[^\"]+\.css" "$STAGING/index.html" | head -1 || true)
                      test -n "$js"
                      test -f "$STAGING$js"
                      if [ -n "$css" ]; then test -f "$STAGING$css"; fi
                      rm -rf "${LIVE}.old"
                      if [ -d "$LIVE" ]; then mv "$LIVE" "${LIVE}.old"; fi
                      mv "$STAGING" "$LIVE"
                      chown -R $SUDO_USER:$SUDO_USER "$LIVE"
                      echo "admin activated: $js"'

            - name: Smoke test admin via Cloudflare
              if: env.RUN_SMOKE_TESTS == 'true'
              run: |
                  fetch() {
                    local url="$1"
                    local attempt=1
                    while [ "$attempt" -le 5 ]; do
                      if out=$(curl -fsS --max-time 15 "$url"); then
                        printf '%s' "$out"
                        return 0
                      fi
                      echo "curl attempt $attempt failed: $url"
                      attempt=$((attempt + 1))
                      sleep 5
                    done
                    return 1
                  }

                  html=""
                  if html=$(fetch "https://admin.alexol.io/"); then
                    base="https://admin.alexol.io"
                  elif html=$(fetch "http://admin.alexol.io/"); then
                    echo "::warning::HTTPS недоступен для admin.alexol.io. Включи Cloudflare Proxy (оранжевое облако) и SSL Flexible."
                    base="http://admin.alexol.io"
                  else
                    echo "admin.alexol.io недоступен ни по HTTPS, ни по HTTP" >&2
                    exit 1
                  fi

                  js=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
                  test -n "$js"
                  fetch "${base}${js}" > /dev/null
                  echo "admin OK: ${base}${js}"

    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create .env file from secret
              run: |
                  echo "${{ secrets.ENV_BE }}" > backend/.env

            - name: Prepare server directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S mkdir -p /var/www/alexol.io/back
                      echo "${{ secrets.PWD }}" | sudo -S chown -R $USER:$USER /var/www/alexol.io/back
                      echo "${{ secrets.PWD }}" | sudo -S chmod -R 755 /var/www/alexol.io/back

            - name: Deploy backend to server
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "backend/**"
                  target: "/var/www/alexol.io/back"
                  overwrite: true
                  strip_components: 1

            - name: Start backend with Docker Compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script_stop: true
                  command_timeout: 30m
                  script: |
                      cd /var/www/alexol.io/back
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc '
                      set -e
                      cd /var/www/alexol.io/back
                      if docker compose version >/dev/null 2>&1; then
                        dc="docker compose"
                      elif command -v docker-compose >/dev/null 2>&1; then
                        dc="docker-compose"
                      else
                        echo "Docker Compose not found"
                        exit 1
                      fi
                      $dc down --remove-orphans || true
                      docker network inspect alexol_mail_sync >/dev/null 2>&1 || docker network create alexol_mail_sync
                      if ! $dc build backend bot_news; then
                        echo "WARN: compose build hit a Docker snapshot error; pruning BuildKit cache"
                        docker builder prune -af || true
                        docker buildx prune -af || true
                        $dc build --no-cache backend bot_news
                      fi
                      $dc up -d --force-recreate
                      $dc up -d bot_news bot_requests bot_speak
                      $dc ps
                      '
