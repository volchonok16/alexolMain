# Nginx деплоится только вручную (Actions → Deploy Nginx → Run workflow).
# Обычный push в master nginx НЕ трогает.

name: Deploy Nginx (manual)

on:
    workflow_dispatch:

jobs:
    deploy-nginx:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Upload nginx configs
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  source: "backend/nginx/**"
                  target: "/tmp/alexol-nginx"
                  overwrite: true
                  strip_components: 2

            - name: Install nginx configs and reload
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_SSH_PORT || '22' }}
                  script: |
                      echo "${{ secrets.PWD }}" | sudo -S bash -lc 'set -e
                      shopt -s nullglob
                      for f in /tmp/alexol-nginx/sites/*.conf; do
                        install -m 644 "$f" "/etc/nginx/sites-available/$(basename "$f" .conf)"
                      done
                      if [ -f /tmp/alexol-nginx/upstream.conf ]; then
                        install -m 644 /tmp/alexol-nginx/upstream.conf /etc/nginx/sites-available/upstream
                      fi
                      for name in upstream alexol.io admin.alexol.io api.alexol.io be.alexol.io chat.alexol.io lang.alexol.io mail.alexol.io meet.alexol.io minio.alexol.io prana.alexol.io voentorg77.ru; do
                        if [ -f "/etc/nginx/sites-available/$name" ]; then
                          ln -sf "/etc/nginx/sites-available/$name" "/etc/nginx/sites-enabled/$name"
                        fi
                      done
                      rm -f /etc/nginx/sites-enabled/default
                      nginx -t
                      systemctl reload nginx
                      rm -rf /tmp/alexol-nginx
                      echo "nginx reloaded"'
