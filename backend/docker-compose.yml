services:
  postgres:
    image: postgres:16-alpine
    container_name: alexol_postgres
    restart: unless-stopped
    ports:
      - "7432:5432"  # Нестандартный внешний порт
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alexol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_DB: ${POSTGRES_DB:-alexol_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alexol_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alexol_user} -d ${POSTGRES_DB:-alexol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alexol_backend
    restart: unless-stopped
    ports:
      - "8547:3000"  # Нестандартный внешний порт
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-alexol_user}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-alexol_db}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_something_secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://alexol.io,https://admin.alexol.io,https://api.alexol.io}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alexol_network
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot_news:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: alexol_bot_news
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Moscow}
      - TDATA_PATH=/app/tdata
      - TELEGRAM_NEWS_BOT_TOKEN=${TELEGRAM_NEWS_BOT_TOKEN}
    command: ["python", "main.py", "--mode", "bot"]
    networks:
      - alexol_network
    volumes:
      - ./bot/data:/app/data
      - ./bot/tdata:/app/tdata

  bot_requests:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: alexol_bot_requests
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Moscow}
      - TDATA_PATH=/app/tdata
    # Для этого сервиса используем объединённый режим:
    # приём заявок (/project) + простая пересылка всех сообщений.
    command: ["python", "main.py", "--mode", "requests"]
    networks:
      - alexol_network
    volumes:
      - ./bot/data:/app/data
      - ./bot/tdata:/app/tdata

  bot_speak:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: alexol_bot_speak
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Moscow}
      - SPEAK_BOT_TOKEN=${SPEAK_BOT_TOKEN}
      - SPEAK_STT_MODEL=${SPEAK_STT_MODEL:-openai/whisper-large-v3}
    command: ["python", "main.py", "--mode", "speak"]
    networks:
      - alexol_network

volumes:
  postgres_data:
    driver: local

networks:
  alexol_network:
    driver: bridge

