# Основной сайт alexol.io
server {
	root /var/www/alexol.io/html;
	index index.html index.htm index.nginx-debian.html;
	server_name alexol.io www.alexol.io;

	location / {
		try_files $uri $uri/ /index.html =404;
	}

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/alexol.io-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexol.io-0002/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.alexol.io) {
        return 301 https://$host$request_uri;
    }

    if ($host = alexol.io) {
        return 301 https://$host$request_uri;
    }

	listen 80 default_server;
	listen [::]:80 default_server;
	server_name alexol.io www.alexol.io;
    return 404;
}

# Админ-панель admin.alexol.io
server {
	server_name admin.alexol.io;

	root /var/www/alexol.io/admin/html;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html =404;
	}

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.alexol.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.alexol.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = admin.alexol.io) {
        return 301 https://$host$request_uri;
    }

	listen 80;
	listen [::]:80;
	server_name admin.alexol.io;
    return 404;
}

# Backend API api.alexol.io
server {
	server_name api.alexol.io;

	location / {
		# Проксирование на бэкенд
		proxy_pass http://localhost:8547;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
		
		# CORS обрабатывает backend (Express), nginx только проксирует
	}

    listen [::]:443 ssl;
    listen 443 ssl;
    # КРИТИЧНО: Должен быть отдельный сертификат для api.alexol.io
    # Создайте его командой: sudo certbot certonly --nginx -d api.alexol.io
    ssl_certificate /etc/letsencrypt/live/api.alexol.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alexol.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.alexol.io) {
        return 301 https://$host$request_uri;
    }

	listen 80;
	listen [::]:80;
	server_name api.alexol.io;
    return 404;
}
