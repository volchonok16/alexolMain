# Конфиги nginx разбиты по доменам в backend/nginx/
#
# Структура:
#   upstream.conf              - общий upstream alexol_backend
#   sites/alexol.io.conf
#   sites/admin.alexol.io.conf
#   sites/prana.alexol.io.conf
#   sites/lang.alexol.io.conf
#   sites/mail.alexol.io.conf
#   sites/meet.alexol.io.conf
#   sites/api.alexol.io.conf
#   sites/be.alexol.io.conf
#   sites/minio.alexol.io.conf
#   sites/voentorg77.ru.conf
#
# Деплой на сервер:
#   - вручную: scp/nano → /etc/nginx/sites-available/, затем nginx -t && reload
#   - или GitHub Actions → "Deploy Nginx (manual)" → Run workflow
#   push в master nginx НЕ перезаписывает
#
# SSL: SAN-сертификат /etc/letsencrypt/live/alexol.io покрывает поддомены.
# Все хосты из этого сертификата должны слушать 443 в git-конфигах
# (admin/api/be/mail/minio/prana/lang). Иначе HTTPS SNI попадает в первый
# ssl-сервер — сейчас это admin.alexol.io и вместо сайта открывается логин админки.

include /etc/nginx/alexol/upstream.conf;
include /etc/nginx/alexol/sites/*.conf;
