# Конфиги nginx разбиты по доменам в backend/nginx/
#
# Структура:
#   upstream.conf              — общий upstream alexol_backend
#   sites/alexol.io.conf
#   sites/admin.alexol.io.conf
#   sites/prana.alexol.io.conf
#   sites/lang.alexol.io.conf
#   sites/mail.alexol.io.conf
#   sites/api.alexol.io.conf
#   sites/be.alexol.io.conf
#   sites/minio.alexol.io.conf
#   sites/voentorg77.ru.conf
#
# Деплой на сервер (Ubuntu/Debian):
#   sudo cp backend/nginx/upstream.conf /etc/nginx/conf.d/alexol-upstream.conf
#   sudo cp backend/nginx/sites/*.conf /etc/nginx/sites-available/
#   # symlink в sites-enabled для каждого сайта, затем:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Либо одним include (если кладёшь всю папку на сервер):
#   include /path/to/backend/nginx/upstream.conf;
#   include /path/to/backend/nginx/sites/*.conf;

include /etc/nginx/alexol/upstream.conf;
include /etc/nginx/alexol/sites/*.conf;
