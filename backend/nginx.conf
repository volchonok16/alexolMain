server {
        server_name api.alexol.io;

        client_max_body_size 10G;

        location /uploads/ {
                alias /var/www/alexol.io/back/uploads/;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Cache-Control "public, max-age=31536000" always;
                expires 1y;
        }

        location / {
                proxy_pass http://alexol_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_request_buffering off;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                proxy_connect_timeout 60s;
        }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.alexol.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.alexol.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

