server {
    if ($host = www.alexol.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = alexol.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

        listen 80 default_server;
        listen [::]:80 default_server;
        server_name alexol.io www.alexol.io;
    return 404; # managed by Certbot
}

