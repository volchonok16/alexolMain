# Mini App карточек
# Если сертификата ещё нет: sudo certbot --nginx -d lang.alexol.io
server {
        server_name lang.alexol.io;

        root /var/www/alexol.io/lang/html;
        index index.html;

        charset utf-8;
        client_max_body_size 2M;

        gzip on;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types
                text/plain
                text/css
                text/xml
                application/json
                application/javascript
                application/xml
                application/xml+rss
                image/svg+xml
                application/manifest+json
                font/woff2;

        location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                try_files $uri =404;
        }

        location = /workbox-window.js {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location = /manifest.webmanifest {
                default_type application/manifest+json;
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }

        # Пока без SSL — сертификат ещё не выпущен
        listen 80;
        listen [::]:80;
}

# Почтовый клиент — SPA + API proxy на mail-server (:17000)
# Если сертификата ещё нет: sudo certbot --nginx -d mail.alexol.io
server {
        server_name mail.alexol.io;

        root /var/www/alexol.io/mail/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 100M;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location /api {
                client_max_body_size 100M;
                proxy_pass http://127.0.0.1:17000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 120s;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        # Не immutable: иначе Cloudflare навсегда кэширует битый JS после деплоя
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate";
                try_files $uri =404;
        }

        # Пока без SSL — сертификат ещё не выпущен
        listen 80;
        listen [::]:80;
}

server {
        server_name api.alexol.io;

        client_max_body_size 10G;
        # Avoid Chrome ERR_HTTP2_PING_FAILED when multiplexed image streams stall
        send_timeout 120s;
        keepalive_timeout 75s;
        keepalive_requests 1000;

        location /uploads/ {
                alias /var/www/alexol.io/back/uploads/;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
                expires 1h;
                # Range requests over HTTP/2 often trigger protocol errors in Chrome
                max_ranges 0;
                sendfile on;
                tcp_nopush on;
                tcp_nodelay on;
                types {
                        image/jpeg jpg jpeg;
                        image/png png;
                        image/gif gif;
                        image/webp webp;
                        image/svg+xml svg;
                }
                default_type application/octet-stream;
        }

        location / {
                proxy_pass http://alexol_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_request_buffering off;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                proxy_connect_timeout 60s;
        }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.alexol.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.alexol.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

