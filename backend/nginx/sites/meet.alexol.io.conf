# Jitsi Meet — HTTPS + прокси на docker web (:18080).
# Комнаты a-/o-/c- без JWT уходят на mail, чтобы имя спрашивали один раз.

map $arg_jwt $jitsi_room_auth {
        default 1;
        ""      0;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name meet.alexol.io;

        ssl_certificate /etc/letsencrypt/live/meet.alexol.io/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/meet.alexol.io/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        client_max_body_size 0;

        # iframe из chat.alexol.io (Rocket.Chat Jitsi) и mail.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' https://chat.alexol.io https://mail.alexol.io" always;

        location ~ ^/((?:a|o|c|anyone|closed)-[A-Za-z0-9._-]+)$ {
                if ($jitsi_room_auth = 0) {
                        return 302 https://mail.alexol.io/jitsi-auth?room=$1;
                }
                proxy_pass http://127.0.0.1:18080;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
                add_header Content-Security-Policy "frame-ancestors 'self' https://chat.alexol.io https://mail.alexol.io" always;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }

        location / {
                proxy_pass http://127.0.0.1:18080;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
                add_header Content-Security-Policy "frame-ancestors 'self' https://chat.alexol.io https://mail.alexol.io" always;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name meet.alexol.io;
        return 301 https://$host$request_uri;
}
