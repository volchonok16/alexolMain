# Jitsi Meet — прокси на docker web (:18080). SSL добавит certbot.
server {
        listen 80;
        listen [::]:80;
        server_name meet.alexol.io;

        client_max_body_size 0;

        # Комната без JWT: один экран имени на mail, без двойного prejoin Jitsi.
        location ~ ^/([A-Za-z0-9][A-Za-z0-9._-]{0,120})$ {
                error_page 418 = @jitsi_proxy;
                if ($arg_jwt != "") {
                        return 418;
                }
                return 302 https://mail.alexol.io/jitsi-auth?room=$1;
        }

        location / {
                proxy_pass http://127.0.0.1:18080;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }

        location @jitsi_proxy {
                proxy_pass http://127.0.0.1:18080;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }
}
