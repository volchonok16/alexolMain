server {
        server_name admin.alexol.io;

        root /var/www/alexol.io/admin/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files /index.html =404;
        }

        location / {
                try_files $uri $uri/ @spa;
        }

        # /users, /courses и т.д. - CF кэширует по URL, не по /index.html
        location @spa {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files /index.html =404;
        }

        # Без immutable - иначе Cloudflare может навсегда закэшировать битый билд
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                gzip off;
                sendfile on;
                tcp_nopush on;
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
                add_header Access-Control-Allow-Origin "*" always;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.alexol.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.alexol.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = admin.alexol.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

        listen 80;
        listen [::]:80;
        server_name admin.alexol.io;
    return 404; # managed by Certbot
}
