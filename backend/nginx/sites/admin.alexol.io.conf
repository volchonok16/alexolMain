# Админка. Без listen 443 SNI падает на alexol.io и отдаёт публичный сайт.
# SAN-сертификат: certbot renew пишет в live/alexol.io.

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name admin.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /var/www/alexol.io/admin/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files /index.html =404;
        }

        location / {
                try_files $uri $uri/ @spa;
        }

        # /users, /courses, /sso — HTML не кэшировать
        location @spa {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files /index.html =404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                gzip off;
                sendfile on;
                tcp_nopush on;
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
                add_header Access-Control-Allow-Origin "*" always;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name admin.alexol.io;

        location ^~ /.well-known/acme-challenge/ {
                root /var/www/html;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}
