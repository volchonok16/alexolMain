# Алиас API. Без listen 443 SNI падает на публичный alexol.io.

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name be.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 10G;
        send_timeout 120s;
        keepalive_timeout 75s;
        keepalive_requests 1000;

        location /courses/ {
                proxy_pass http://127.0.0.1:9000;
                proxy_http_version 1.1;
                proxy_set_header Host 127.0.0.1:9000;
                proxy_set_header Connection "";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_connect_timeout 300s;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        }

        location /uploads/ {
                alias /var/www/alexol.io/back/uploads/;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
                expires 1h;
                max_ranges 0;
                sendfile on;
                tcp_nopush on;
                tcp_nodelay on;
                types {
                        image/jpeg jpg jpeg;
                        image/png png;
                        image/gif gif;
                        image/webp webp;
                        image/svg+xml svg;
                }
                default_type application/octet-stream;
        }

        location / {
                proxy_pass http://alexol_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_request_buffering off;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                proxy_connect_timeout 60s;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name be.alexol.io;

        location ^~ /.well-known/acme-challenge/ {
                root /var/www/html;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}
