server {
        server_name voentorg77.ru www.voentorg77.ru;

        root /var/www/voentorg77;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache";
                try_files /index.html =404;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/voentorg77.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/voentorg77.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.voentorg77.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = voentorg77.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

        listen 80;
        listen [::]:80;
        server_name voentorg77.ru www.voentorg77.ru;
    return 404; # managed by Certbot
}
