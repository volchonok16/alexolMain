# Mini App карточек
server {
        server_name lang.alexol.io;

        root /var/www/alexol.io/lang/html;
        index index.html;

        charset utf-8;
        client_max_body_size 2M;

        gzip on;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types
                text/plain
                text/css
                text/xml
                application/json
                application/javascript
                application/xml
                application/xml+rss
                image/svg+xml
                application/manifest+json
                font/woff2;

        location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                try_files $uri =404;
        }

        location = /workbox-window.js {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location = /manifest.webmanifest {
                default_type application/manifest+json;
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate";
                access_log off;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lang.alexol.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lang.alexol.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = lang.alexol.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

        listen 80;
        listen [::]:80;
        server_name lang.alexol.io;
    return 404; # managed by Certbot
}
