server {
        server_name alexol.io www.alexol.io;

        if ($host = www.alexol.io) {
                return 301 https://alexol.io$request_uri;
        }

        root /var/www/alexol.io/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location = /robots.txt {
                default_type text/plain;
                charset utf-8;
                add_header Cache-Control "public, max-age=86400" always;
                try_files $uri =404;
        }

        location = /sitemap.xml {
                default_type application/xml;
                charset utf-8;
                add_header Cache-Control "public, max-age=86400" always;
                try_files $uri =404;
        }

        # index нельзя кэшировать - иначе CF/браузер тянут старые hash-имена JS после деплоя
        location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files /index.html =404;
        }

        location / {
                try_files $uri $uri/ @spa;
        }

        location @spa {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                try_files /index.html =404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                gzip off;
                sendfile on;
                tcp_nopush on;
                expires 7d;
                add_header Cache-Control "public, max-age=604800, must-revalidate" always;
                add_header Access-Control-Allow-Origin "*" always;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name alexol.io www.alexol.io;
        return 301 https://alexol.io$request_uri;
}
