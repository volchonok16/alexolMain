server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name alexol.io www.alexol.io;
        return 301 https://alexol.io$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name alexol.io www.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        if ($host = www.alexol.io) {
                return 301 https://alexol.io$request_uri;
        }

        root /var/www/alexol.io/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        # Карты/Вебвизор: цепочка iframe (metrika.ya.ru + webvisor.org тоже).
        # Неполный frame-ancestors даёт ту же ошибку, что и X-Frame-Options.
        # Список: официальный frame-ancestors Яндекса + webvisor.com/org http/https.
        set $metrika_frames "frame-ancestors 'self' http://webvisor.com http://*.webvisor.com https://webvisor.com https://*.webvisor.com http://webvisor.org http://*.webvisor.org https://webvisor.org https://*.webvisor.org https://mc.webvisor.com https://mc.webvisor.org https://ya.ru https://*.ya.ru https://metrika.ya.ru https://metrica.ya.ru https://yandex.ru https://*.yandex.ru https://yandex.by https://*.yandex.by https://yandex.com https://*.yandex.com https://yandex.com.tr https://*.yandex.com.tr https://yandex.kz https://*.yandex.kz https://yandex.uz https://*.yandex.uz https://metrika.yandex.ru https://*.metrika.yandex.ru https://metrika.yandex.by https://metrika.yandex.com https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz https://metrica.yandex.ru https://metrica.yandex.by https://metrica.yandex.com https://metrica.yandex.com.tr https://metrica.yandex.kz https://analytics.yandex.ru https://analytics.yandex.by https://analytics.yandex.com https://analytics.yandex.com.tr https://analytics.yandex.kz https://metr.yandex.ru https://metr.yandex.by https://metr.yandex.com https://metr.yandex.com.tr https://metr.yandex.kz https://mc.yandex.ru https://mc.yandex.com;";

        location = /robots.txt {
                default_type text/plain;
                charset utf-8;
                add_header Cache-Control "public, max-age=86400" always;
                try_files $uri =404;
        }

        location = /sitemap.xml {
                default_type application/xml;
                charset utf-8;
                add_header Cache-Control "public, max-age=86400" always;
                try_files $uri =404;
        }

        location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Content-Security-Policy $metrika_frames always;
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Content-Security-Policy $metrika_frames always;
                try_files /index.html =404;
        }

        location / {
                add_header Content-Security-Policy $metrika_frames always;
                try_files $uri $uri/ @spa;
        }

        location @spa {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Content-Security-Policy $metrika_frames always;
                try_files /index.html =404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                gzip off;
                sendfile on;
                tcp_nopush on;
                expires 7d;
                add_header Cache-Control "public, max-age=604800, must-revalidate" always;
                add_header Access-Control-Allow-Origin "*" always;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }
}
