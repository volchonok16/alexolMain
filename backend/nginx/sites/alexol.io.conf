server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name alexol.io www.alexol.io;

        # Плеер http://webvisor.com грузит http://alexol.io. Сплошной 301 ломает карты.
        set $https_redirect 1;
        if ($http_referer ~* '(webvisor\.(com|org|ru)|metri[ck]a\.yandex|metri[ck]a\.ya\.ru|analytics\.yandex|metr\.yandex|mc\.yandex|mc\.webvisor)') {
                set $https_redirect 0;
        }
        if ($https_redirect = 1) {
                return 301 https://alexol.io$request_uri;
        }

        root /var/www/alexol.io/html;
        index index.html;
        add_header Content-Security-Policy "frame-ancestors 'self' https: http:;" always;

        location / {
                try_files $uri $uri/ /index.html;
        }
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name alexol.io www.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        if ($host = www.alexol.io) {
                return 301 https://alexol.io$request_uri;
        }

        root /var/www/alexol.io/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        # Карты/Вебвизор грузят сайт цепочкой iframe (metrika → webvisor → иногда yastatic/yandex.net).
        # Жёсткий whitelist host'ов ломает плеер: «запрет на отображение во фрейме».
        # https:/http: = любой http(s)-предок, без X-Frame-Options.
        set $metrika_frames "frame-ancestors 'self' https: http:";

        location = /robots.txt {
                default_type text/plain;
                charset utf-8;
                add_header Cache-Control "public, max-age=86400" always;
                try_files $uri =404;
        }

        location = /sitemap.xml {
                default_type application/xml;
                charset utf-8;
                add_header Cache-Control "public, max-age=86400" always;
                try_files $uri =404;
        }

        location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Content-Security-Policy $metrika_frames always;
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Content-Security-Policy $metrika_frames always;
                try_files /index.html =404;
        }

        location / {
                add_header Content-Security-Policy $metrika_frames always;
                try_files $uri $uri/ @spa;
        }

        location @spa {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Content-Security-Policy $metrika_frames always;
                try_files /index.html =404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                gzip off;
                sendfile on;
                tcp_nopush on;
                expires 7d;
                add_header Cache-Control "public, max-age=604800, must-revalidate" always;
                add_header Access-Control-Allow-Origin "*" always;
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }
}
