# Без listen 443 SNI падает на admin.alexol.io: /login → логин админки.
# SAN-сертификат: certbot renew пишет в live/alexol.io.

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name prana.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /var/www/alexol.io/prana/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location = / {
                add_header Cache-Control "no-cache";
                try_files /index.html =404;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name prana.alexol.io;

        location ^~ /.well-known/acme-challenge/ {
                root /var/www/html;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}
