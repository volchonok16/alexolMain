# Без listen 443 SNI падает на admin.alexol.io: /courses/*.png → 404, /courses/ → логин админки.
# SAN-сертификат: certbot renew пишет в live/alexol.io.

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name minio.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 10G;
        ignore_invalid_headers off;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
                proxy_pass http://127.0.0.1:9000;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header Connection "";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 300s;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                chunked_transfer_encoding off;

                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "*" always;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name minio.alexol.io;

        location ^~ /.well-known/acme-challenge/ {
                root /var/www/html;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}
