# Rocket.Chat — HTTPS + proxy на docker (:18300).
# Сертификат: sudo certbot --nginx -d chat.alexol.io

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name chat.alexol.io;

        ssl_certificate /etc/letsencrypt/live/chat.alexol.io/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/chat.alexol.io/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        client_max_body_size 200M;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        location = /alexol-logo.svg {
                alias /var/www/chat-brand/login-logo.svg;
                default_type image/svg+xml;
                add_header Cache-Control "public, max-age=86400";
        }

        location = /alexol-brand.js {
                alias /var/www/chat-brand/login-brand.js;
                default_type application/javascript;
                add_header Cache-Control "no-cache";
        }

        location = /alexol-brand.css {
                alias /var/www/chat-brand/login.css;
                default_type text/css;
                add_header Cache-Control "no-cache";
        }

        location /sockjs/ {
                proxy_pass http://127.0.0.1:18300;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }

        location /websocket {
                proxy_pass http://127.0.0.1:18300;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }

        location / {
                proxy_pass http://127.0.0.1:18300;
                proxy_http_version 1.1;
                proxy_buffering on;
                proxy_request_buffering off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Accept-Encoding "";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
                sub_filter_once off;
                sub_filter_types text/html;
                sub_filter '</head>' '<link rel="stylesheet" href="/alexol-brand.css"><script src="/alexol-brand.js" defer></script></head>';
                sub_filter '</HEAD>' '<link rel="stylesheet" href="/alexol-brand.css"><script src="/alexol-brand.js" defer></script></HEAD>';
                sub_filter '<body' '<link rel="stylesheet" href="/alexol-brand.css"><script src="/alexol-brand.js" defer></script><body';
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name chat.alexol.io;
        return 301 https://$host$request_uri;
}
