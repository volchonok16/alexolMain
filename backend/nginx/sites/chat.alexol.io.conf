# Rocket.Chat — HTTPS + proxy на docker (:18300).
# Сертификат: sudo certbot --nginx -d chat.alexol.io

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name chat.alexol.io;

        ssl_certificate /etc/letsencrypt/live/chat.alexol.io/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/chat.alexol.io/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        client_max_body_size 200M;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        location / {
                proxy_pass http://127.0.0.1:18300;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name chat.alexol.io;
        return 301 https://$host$request_uri;
}
