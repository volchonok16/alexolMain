# Почта — SPA + API proxy на mail-server (:17000).
# SAN-сертификат: certbot renew пишет в live/alexol.io (там же mail.alexol.io).
# Не оставляйте только listen 80: deploy-nginx затирает правки certbot.

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name mail.alexol.io;

        ssl_certificate /etc/letsencrypt/live/alexol.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexol.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /var/www/alexol.io/mail/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 100M;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location ^~ /api {
                client_max_body_size 100M;
                proxy_pass http://127.0.0.1:17000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 120s;
        }

        location ^~ /.well-known/carddav {
                proxy_pass http://127.0.0.1:17000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location ^~ /outlook-jitsi/ {
                types { application/xml xml; text/html html; image/png png; }
                add_header Content-Security-Policy "frame-ancestors https://outlook.office.com https://outlook.office365.com https://outlook.live.com;" always;
                add_header Cache-Control "public, max-age=300";
                try_files $uri =404;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate";
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }
}

server {
        listen 80;
        listen [::]:80;
        server_name mail.alexol.io;

        location ^~ /.well-known/acme-challenge/ {
                root /var/www/html;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}
