# Почта - SPA + API proxy на mail-server (:17000)
server {
        listen 80;
        listen [::]:80;
        server_name mail.alexol.io;

        root /var/www/alexol.io/mail/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 100M;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        # ^~ - иначе regex для .jpg/.png перехватывает /api/media/...jpg и отдаёт 404 со статики
        location ^~ /api {
                client_max_body_size 100M;
                proxy_pass http://127.0.0.1:17000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 120s;
        }

        location = /index.html {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }

        # Важно: без immutable - Cloudflare иначе кэширует битый JS (пустая страница логина)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate";
                try_files $uri =404;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }
}
